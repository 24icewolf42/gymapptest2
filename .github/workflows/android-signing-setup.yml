name: Set up Android release signing (run once)

# Creates the private release key inside GitHub Actions and stores it as
# secrets of the "production" environment, so it never exists on anyone's
# computer or in the repo. The APK workflow then signs every release with it.
#
# Needed once before running, in the "production" environment:
#   secret   ADMIN_GH_TOKEN          fine-grained token for this repository with
#                                    "Environments", "Secrets" and "Variables": read and write
#   variable KEYSTORE_BACKUP_CERT    the owner's certificate (PEM) the backup is encrypted to
# Afterwards download the "release-key-backup" artifact (keystore and rotation
# proof, readable only with the certificate's private key), keep it somewhere
# safe and delete the artifact: without the key, updates can never be installed
# over the app. Then delete ADMIN_GH_TOKEN.

on:
  workflow_dispatch:
    inputs:
      replace_existing:
        description: Replace an existing key (every user must reinstall the app again)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  create-key:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      GH_TOKEN: ${{ secrets.ADMIN_GH_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BACKUP_CERT: ${{ vars.KEYSTORE_BACKUP_CERT }}
    steps:
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check settings
        run: |
          test -n "$GH_TOKEN" || { echo "::error::Add the ADMIN_GH_TOKEN secret first"; exit 1; }
          printf '%s\n' "$BACKUP_CERT" | openssl x509 -noout 2>/dev/null || { echo "::error::Add the KEYSTORE_BACKUP_CERT variable (a PEM certificate) first"; exit 1; }
          if gh secret list --env production | grep -q '^ANDROID_KEYSTORE_BASE64'; then
            if [ "${{ inputs.replace_existing }}" != "true" ]; then
              echo "::error::A release key already exists. Re-run with 'Replace an existing key' only if it is lost or leaked."
              exit 1
            fi
          fi

      # Full history: the old, public debug key is read from the commit that removed it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # Also creates the signed rotation from the old key, so phones on Android 9+
      # update to the new key without reinstalling.
      - name: Create the key and store it as secrets
        run: |
          git show 108ba0b:android-signing/debug.keystore > "$RUNNER_TEMP/legacy.keystore"
          LEGACY_KEYSTORE="$RUNNER_TEMP/legacy.keystore" bash tools/create-release-key.sh "$RUNNER_TEMP/release-key-backup.p7m"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-key-backup
          path: ${{ runner.temp }}/release-key-backup.p7m
          retention-days: 1

      - name: How to restore the backup
        run: |
          echo "Decrypt with: openssl cms -decrypt -binary -inform DER -in release-key-backup.p7m -inkey <your private key> -out backup.tgz"
          echo "then: tar -xzf backup.tgz. Delete the artifact once you have it."
