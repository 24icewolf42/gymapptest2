name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# The build runs third-party install code, so it gets a read-only token. Only
# the publish job, which runs no dependency code, can write releases.
permissions:
  contents: read

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        run: |
          set -o pipefail
          bash tools/build-apk.sh 2>&1 | tee "$RUNNER_TEMP/build.log"
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rat-tracker-apk
          path: build-apk/rat-tracker.apk

      - name: Keep the build log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: Version

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rat-tracker-apk
          path: build-apk

      - name: Publish APK as the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VER="$(node -e "console.log(JSON.parse(require('fs').readFileSync('Version', 'utf8')).version)")"
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest build-apk/rat-tracker.apk \
            --title "Tracker v$VER" \
            --notes "Installable Android build of the app (built from commit ${GITHUB_SHA::7})." \
            --target "$GITHUB_SHA" --latest
