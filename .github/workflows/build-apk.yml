name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# The build runs third-party install code, so it gets a read-only token. Only
# the publish job, which runs no dependency code, can write releases.
permissions:
  contents: read

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      # Release signing: the private key lives only in repository secrets. Without
      # them the build fails instead of publishing a debug-signed app.
      - name: Build APK
        run: |
          set -o pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Add the ANDROID_* signing secrets first (see README)"; exit 1; }
          bash tools/build-apk.sh 2>&1 | tee "$RUNNER_TEMP/build.log"
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rat-tracker-apk
          path: |
            build-apk/rat-tracker.apk
            build-apk/rat-tracker.apk.sha256

      - name: Keep the build log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: Version

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rat-tracker-apk
          path: build-apk

      # Re-check what the build job produced before it reaches every phone.
      - name: Verify the APK
        env:
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          test "$(sha256sum build-apk/rat-tracker.apk | cut -d' ' -f1)" = "$(cat build-apk/rat-tracker.apk.sha256)"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs build-apk/rat-tracker.apk | tee "$RUNNER_TEMP/certs.txt"
          have="$(grep -m1 'certificate SHA-256 digest' "$RUNNER_TEMP/certs.txt" | sed 's/.*: //' | tr 'a-f' 'A-F')"
          want="$(printf '%s' "$ANDROID_CERT_SHA256" | tr -d ' :' | tr 'a-f' 'A-F')"
          test -n "$want" && test "$have" = "$want"

      - name: Publish APK as the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VER="$(node -e "console.log(JSON.parse(require('fs').readFileSync('Version', 'utf8')).version)")"
          gh release delete latest --cleanup-tag --yes || true
          # The app compares the build number (versionCode = run number) to its own.
          gh release create latest build-apk/rat-tracker.apk \
            --title "Tracker v$VER (build ${{ github.run_number }})" \
            --notes "Installable Android build of the app (built from commit ${GITHUB_SHA::7})." \
            --target "$GITHUB_SHA" --latest
