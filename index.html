<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0e10">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://aiiyombsmvlbhifxgkhp.supabase.co wss://aiiyombsmvlbhifxgkhp.supabase.co; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; require-trusted-types-for 'script'; trusted-types tracker">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script src="js/theme-boot.js"></script>
  <link rel="stylesheet" href="css/app.css">
  <title>Tracker</title>
</head>
<body data-page="today">
  <div id="loadingScreen" aria-hidden="true">
    <img src="snake-loading.gif" alt="">
    <div class="loading-label">Death to the World</div>
  </div>

  <main id="app">
    <aside id="installBanner" class="install-banner" aria-label="Install Tracker" hidden>
      <div><b id="installTitle">Get the Tracker app</b><small id="installHint">Install it on your phone for the full app experience.</small></div>
      <a class="btn btn-primary btn-sm" id="installLink" href="https://github.com/roguelineageaccmanager/gymapptest2/releases/download/latest/rat-tracker.apk">Install</a>
      <button type="button" class="btn btn-primary btn-sm" id="installHelp" hidden>How to add</button>
      <button type="button" class="icon-btn sm" id="installClose" aria-label="Dismiss">&times;</button>
    </aside>
    <section class="page active" id="page-today" aria-label="Today"></section>
    <section class="page" id="page-plan" aria-label="Plan"></section>
    <section class="page" id="page-calendar" aria-label="Calendar"></section>
    <section class="page" id="page-stats" aria-label="Stats"></section>
    <section class="page" id="page-crew" aria-label="Crew"></section>
    <section class="page" id="page-settings" aria-label="Settings"></section>
  </main>

  <nav class="bottom-nav" id="bottomNav" aria-label="Main"></nav>

  <div id="activeBar" class="active-bar" hidden></div>

  <div id="session" class="session" hidden role="dialog" aria-modal="true" aria-labelledby="sessionTitle"></div>
  <div id="sheetRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="toastAlert" class="sr-only" role="alert"></div>

  <noscript><p class="noscript">Tracker needs JavaScript to run.</p></noscript>
  <script src="vendor/supabase.js"></script>
  <script src="cloud-config.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
